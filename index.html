<!DOCTYPE html>
<html>
    <body>
        <label for="server">Select Server:</label>
        <select name="server" id="server">
            <option value="sg2">SEA Server</option>
        </select>

        <input type="text" name="gameName" id="gameName" placeholder="Enter your In-game Name"> <!-- Text Box for IGN -->
        <input type="text" name="tagLine" id="tagLine" placeholder="Enter your TagLine"> <!-- Text Box for IGN -->

        <button id="search">Search</button>

        <p id="GameName"></p> 
        <p id="TagLine"></p>
        <img id ="profileIcon" alt = "league icon" hidden>
        <p id="profileIconId"></p>        
        <p id="summonerLevel"></p>

        <p id="SRQueue"></p>
        <p id="SRTier"></p>
        <p id="SRRank"></p>
        <p id="SRLP"></p>
        <p id="SRW"></p>
        <p id="SRL"></p>

        <p id="FLEXQueue"></p>
        <p id="FLEXTier"></p>
        <p id="FLEXTier"></p>
        <p id="FLEXLP"></p>
        <p id="FLEXW"></p>
        <p id="FLEXL"></p>

        <p id="FIVEQueue"></p>
        <p id="FIVETier"></p>
        <p id="FIVERank"></p>
        <p id="FIVELP"></p>
        <p id="FIVEW"></p>
        <p id="FIVEL"></p>

        <p id="CLASSICQueue"></p>
        <p id="CLASSICTier"></p>
        <p id="CLASSICRank"></p>
        <p id="CLASSICLP"></p>
        <p id="CLASSICW"></p>
        <p id="CLASSICL"></p>     
        
        <div id = "matchHistory">
            <h4>Match History</h4>
            <ul id="matchList"></ul>
        </div>


        <script>
        document.getElementById("search").addEventListener("click", function () {

        const gameName = document.getElementById("gameName").value;
        const tagLine = document.getElementById("tagLine").value;
        const server = document.getElementById("server").value;

        fetch(`http://localhost:2106/riot/account?gameName=${gameName}&tagLine=${tagLine}&server=${server}`)
        .then(response => {
           console.log(response.status);
           return response.json();
            })
            .then(data => {
                console.log(data);
                
                document.getElementById("TagLine").textContent = data.tagLine
                document.getElementById("GameName").textContent = data.gameName
                document.getElementById("profileIconId").textContent = data.profileIconId;
                document.getElementById("profileIcon").src = `https://ddragon.leagueoflegends.com/cdn/16.17.1/img/profileicon/${data.profileIconId}.png`;
                document.getElementById("summonerLevel").textContent =data.summonerLevel;

                if (data.SR) {
                    document.getElementById("SRQueue").textContent = data.SR.queueType;
                    document.getElementById("SRTier").textContent = data.SR.tier;
                    document.getElementById("SRRank").textContent = data.SR.rank;
                    document.getElementById("SRLP").textContent = data.SR.leaguePoints;
                    document.getElementById("SRW").textContent = data.SR.wins;
                    document.getElementById("SRL").textContent = data.SR.losses;
                    } else {
                    document.getElementById("SRQueue").textContent = "Unranked Solo/Duo";
                    };
                
                if (data.FLEX) {
                    document.getElementById("FLEXQueue").textContent = data.FLEX.queueType;
                    document.getElementById("FLEXTier").textContent = data.FLEX.tier;
                    document.getElementById("FLEXLP").textContent = data.FLEX.leaguePoints;
                    document.getElementById("FLEXW").textContent = data.FLEX.wins;
                    document.getElementById("FLEXL").textContent = data.FLEX.losses;
                    } else {
                    document.getElementById("FLEXQueue").textContent = "Unranked Flex";
                    };

                if (data.FIVE) {
                    document.getElementById("FIVEQueue").textContent = data.FIVE.queueType;
                    document.getElementById("FIVETier").textContent = data.FIVE.tier;
                    document.getElementById("FIVERank").textContent = data.FIVE.rank;
                    document.getElementById("FIVELP").textContent = data.FIVE.leaguePoints;
                    document.getElementById("FIVEW").textContent = data.FIVE.wins;
                    document.getElementById("FIVEL").textContent = data.FIVE.losses;
                    } else {
                    document.getElementById("FIVEQueue").textContent = "Unranked Premade 5v5";
                    };
                
                if (data.CLASSIC) {
                    document.getElementById("CLASSICQueue").textContent = data.CLASSIC.queueType;
                    document.getElementById("CLASSICTier").textContent = data.CLASSIC.tier;
                    document.getElementById("CLASSICRank").textContent = data.CLASSIC.rank;
                    document.getElementById("CLASSICLP").textContent = data.CLASSIC.leaguePoints;
                    document.getElementById("CLASSICW").textContent = data.CLASSIC.wins;
                    document.getElementById("CLASSICL").textContent = data.CLASSIC.losses;
                    } else {
                    document.getElementById("CLASSICQueue").textContent = "Unranked Classic";
                    };

                document.getElementById("profileIcon").hidden = false;
                const matchList = document.getElementById("matchList");
                const match = document.createElement("p");
                    match.innerHTML = data.matchHistory;
                        data.matchHistory.forEach(matchId => {
                            const matchItem = document.createElement("li");
                            matchItem.textContent = matchId;
                            matchList.appendChild(matchItem);
                        });
                
            });
        });
        </script>
    </body>
</html>
